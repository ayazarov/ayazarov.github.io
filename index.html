  <body>
    <script>
      // Apply the saved/preferred theme before React mounts, so there's no
      // flash of the light theme for users who prefer/saved dark.
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.body.classList.add(theme + '-theme')
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
  </body>
